<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10131c">
  <title>Simple Calculator</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #252b3c, #10131c 65%);
      color: #f5f7ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .calculator {
      width: min(100%, 360px);
      padding: 24px;
      border: 1px solid #343b50;
      border-radius: 24px;
      background: #191e2b;
      box-shadow: 0 24px 70px #0008;
    }

    h1 {
      margin: 0 0 18px;
      color: #aeb8d0;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-align: center;
      text-transform: uppercase;
    }

    .display {
      min-height: 100px;
      margin-bottom: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      border-radius: 16px;
      background: #10141e;
      text-align: right;
    }

    .previous-operand {
      min-height: 1.4em;
      color: #909ab2;
      font-size: 1rem;
      overflow-wrap: anywhere;
    }

    .current-operand {
      font-size: clamp(2rem, 12vw, 2.8rem);
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      min-height: 58px;
      border: 0;
      border-radius: 14px;
      background: #292f40;
      color: #f5f7ff;
      cursor: pointer;
      font: inherit;
      font-size: 1.2rem;
      transition: background 120ms ease, transform 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { background: #383f53; }
    button:active { transform: scale(0.96); }
    button:focus-visible { outline: 3px solid #a48bff; outline-offset: 2px; }
    button.utility { background: #3a4052; color: #c6b8ff; }
    button.operator { background: #34304d; color: #c6b8ff; }
    button.equals { grid-row: span 2; background: #8065e8; color: white; }
    button.equals:hover { background: #927cf0; }
    button.zero { grid-column: span 2; }

    @media (max-width: 380px) {
      .calculator { padding: 18px; }
      .keys { gap: 8px; }
      button { min-height: 54px; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1>Calculator</h1>
    <section class="display" aria-live="polite" aria-atomic="true" aria-label="Calculator display">
      <div class="previous-operand" id="previous-operand"></div>
      <div class="current-operand" id="current-operand">0</div>
    </section>
    <section class="keys" aria-label="Calculator keys">
      <button class="utility" data-action="clear" aria-label="Clear all">AC</button>
      <button class="utility" data-action="sign" aria-label="Change sign">+/−</button>
      <button class="utility" data-action="percent" aria-label="Percent">%</button>
      <button class="operator" data-operation="÷" aria-label="Divide">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-operation="×" aria-label="Multiply">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-operation="−" aria-label="Subtract">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="operator" data-operation="+" aria-label="Add">+</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
    </section>
  </main>

  <script>
    const currentOperandElement = document.getElementById('current-operand');
    const previousOperandElement = document.getElementById('previous-operand');

    let currentOperand = '0';
    let previousOperand = '';
    let operation = null;
    let shouldResetScreen = false;

    function updateDisplay() {
      currentOperandElement.textContent = currentOperand;
      previousOperandElement.textContent = operation
        ? `${previousOperand} ${operation}`
        : '';
    }

    function appendDigit(digit) {
      if (currentOperand === 'Error' || shouldResetScreen) {
        currentOperand = digit;
        shouldResetScreen = false;
      } else if (currentOperand === '0') {
        currentOperand = digit;
      } else if (currentOperand.length < 14) {
        currentOperand += digit;
      }
      updateDisplay();
    }

    function chooseOperation(nextOperation) {
      if (currentOperand === 'Error') return;
      if (operation && !shouldResetScreen) calculate();
      previousOperand = currentOperand;
      operation = nextOperation;
      shouldResetScreen = true;
      updateDisplay();
    }

    function calculate() {
      if (!operation || currentOperand === 'Error') return;
      const first = Number(previousOperand);
      const second = Number(currentOperand);
      let result;

      switch (operation) {
        case '+': result = first + second; break;
        case '−': result = first - second; break;
        case '×': result = first * second; break;
        case '÷': result = second === 0 ? NaN : first / second; break;
        default: return;
      }

      currentOperand = Number.isFinite(result)
        ? String(Number(result.toPrecision(10)))
        : 'Error';
      previousOperand = '';
      operation = null;
      shouldResetScreen = true;
      updateDisplay();
    }

    function clearCalculator() {
      currentOperand = '0';
      previousOperand = '';
      operation = null;
      shouldResetScreen = false;
      updateDisplay();
    }

    function handleAction(action) {
      switch (action) {
        case 'clear': clearCalculator(); break;
        case 'equals': calculate(); break;
        case 'decimal':
          if (currentOperand === 'Error' || shouldResetScreen) {
            currentOperand = '0.';
            shouldResetScreen = false;
          } else if (!currentOperand.includes('.')) {
            currentOperand += '.';
          }
          updateDisplay();
          break;
        case 'sign':
          if (currentOperand !== '0' && currentOperand !== 'Error') {
            currentOperand = currentOperand.startsWith('-')
              ? currentOperand.slice(1)
              : `-${currentOperand}`;
          }
          updateDisplay();
          break;
        case 'percent':
          if (currentOperand !== 'Error') {
            currentOperand = String(Number(currentOperand) / 100);
            shouldResetScreen = true;
          }
          updateDisplay();
          break;
      }
    }

    document.querySelector('.keys').addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;

      if (button.dataset.digit !== undefined) appendDigit(button.dataset.digit);
      else if (button.dataset.operation) chooseOperation(button.dataset.operation);
      else if (button.dataset.action) handleAction(button.dataset.action);
    });

    document.addEventListener('keydown', (event) => {
      if (/^[0-9]$/.test(event.key)) appendDigit(event.key);
      else if (event.key === '.') handleAction('decimal');
      else if (event.key === 'Enter' || event.key === '=') handleAction('equals');
      else if (event.key === 'Escape' || event.key === 'Delete') handleAction('clear');
      else if (event.key === '+') chooseOperation('+');
      else if (event.key === '-') chooseOperation('−');
      else if (event.key === '*') chooseOperation('×');
      else if (event.key === '/') chooseOperation('÷');
      else return;
      event.preventDefault();
    });
  </script>
</body>
</html>
