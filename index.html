<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10131c">
  <title>Orbit — Calculator</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 18% 12%, #51408055, transparent 38%),
        radial-gradient(ellipse at 85% 85%, #1b767255, transparent 36%),
        #0b0d14;
      color: #f7f6fc;
    }

    .calculator {
      width: min(100%, 370px);
      padding: 25px;
      border: 1px solid #ffffff16;
      border-radius: 30px;
      background: linear-gradient(145deg, #1d2030ed, #131621f2);
      box-shadow: 0 32px 90px #0009, inset 0 1px #ffffff12;
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 2px 22px;
    }

    h1 {
      margin: 0;
      font-size: 0.88rem;
      font-weight: 650;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid #a48bff40;
      border-radius: 10px;
      background: #a48bff18;
      color: #b7a5ff;
      font-size: 1rem;
    }

    .display {
      min-height: 134px;
      margin-bottom: 18px;
      padding: 18px 17px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      border: 1px solid #ffffff08;
      border-radius: 21px;
      background: linear-gradient(145deg, #0d1019, #111522);
      text-align: right;
      box-shadow: inset 0 2px 12px #0004;
    }

    .previous-operand {
      min-height: 1.5em;
      color: #848ba1;
      font-size: 0.95rem;
      overflow-wrap: anywhere;
    }

    .current-operand {
      color: #fbfaff;
      font-size: clamp(2.2rem, 12vw, 3.15rem);
      font-weight: 350;
      letter-spacing: -0.055em;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      min-height: 61px;
      border: 1px solid #ffffff09;
      border-radius: 17px;
      background: linear-gradient(145deg, #292d3d, #242837);
      color: #f3f2f8;
      cursor: pointer;
      font: inherit;
      font-size: 1.18rem;
      font-weight: 520;
      transition: transform 140ms ease, background 140ms ease, box-shadow 140ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      background: linear-gradient(145deg, #383d50, #303548);
      box-shadow: 0 5px 16px #0003;
    }

    button:active { transform: scale(0.95); }
    button:focus-visible { outline: 2px solid #b2a1ff; outline-offset: 3px; }

    button.utility {
      background: #343749;
      color: #c1b4ff;
      font-size: 1rem;
    }

    button.operator {
      border-color: #b19aff12;
      background: #302b42;
      color: #c4b5ff;
      font-size: 1.35rem;
    }

    button.operator:hover { background: #40375a; }

    button.equals {
      grid-row: span 2;
      border-color: #c9bcff55;
      background: linear-gradient(150deg, #a18bff, #795ee6);
      color: white;
      font-size: 1.5rem;
      box-shadow: 0 8px 22px #8468ed3b, inset 0 1px #ffffff55;
    }

    button.equals:hover {
      background: linear-gradient(150deg, #b09fff, #8b73f1);
      box-shadow: 0 10px 26px #8468ed60;
    }

    button.zero { grid-column: span 2; }

    @media (max-width: 380px) {
      body { padding: 16px; }
      .calculator { padding: 19px; border-radius: 26px; }
      .keys { gap: 8px; }
      button { min-height: 56px; border-radius: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <header class="brand">
      <h1>Orbit calculator</h1>
      <span class="brand-mark" aria-hidden="true">✳</span>
    </header>
    <section class="display" aria-live="polite" aria-atomic="true" aria-label="Calculator display">
      <div class="previous-operand" id="previous-operand"></div>
      <div class="current-operand" id="current-operand">0</div>
    </section>
    <section class="keys" aria-label="Calculator keys">
      <button class="utility" data-action="clear" aria-label="Clear all">AC</button>
      <button class="utility" data-action="sign" aria-label="Change sign">+/−</button>
      <button class="utility" data-action="percent" aria-label="Percent">%</button>
      <button class="operator" data-operation="÷" aria-label="Divide">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-operation="×" aria-label="Multiply">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-operation="−" aria-label="Subtract">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="operator" data-operation="+" aria-label="Add">+</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
    </section>
  </main>

  <script>
    const currentOperandElement = document.getElementById('current-operand');
    const previousOperandElement = document.getElementById('previous-operand');

    let currentOperand = '0';
    let previousOperand = '';
    let operation = null;
    let shouldResetScreen = false;

    function updateDisplay() {
      currentOperandElement.textContent = currentOperand;
      previousOperandElement.textContent = operation
        ? `${previousOperand} ${operation}`
        : '';
    }

    function appendDigit(digit) {
      if (currentOperand === 'Error' || shouldResetScreen) {
        currentOperand = digit;
        shouldResetScreen = false;
      } else if (currentOperand === '0') {
        currentOperand = digit;
      } else if (currentOperand.length < 14) {
        currentOperand += digit;
      }
      updateDisplay();
    }

    function chooseOperation(nextOperation) {
      if (currentOperand === 'Error') return;
      if (operation && !shouldResetScreen) calculate();
      previousOperand = currentOperand;
      operation = nextOperation;
      shouldResetScreen = true;
      updateDisplay();
    }

    function calculate() {
      if (!operation || currentOperand === 'Error') return;
      const first = Number(previousOperand);
      const second = Number(currentOperand);
      let result;

      switch (operation) {
        case '+': result = first + second; break;
        case '−': result = first - second; break;
        case '×': result = first * second; break;
        case '÷': result = second === 0 ? NaN : first / second; break;
        default: return;
      }

      currentOperand = Number.isFinite(result)
        ? String(Number(result.toPrecision(10)))
        : 'Error';
      previousOperand = '';
      operation = null;
      shouldResetScreen = true;
      updateDisplay();
    }

    function clearCalculator() {
      currentOperand = '0';
      previousOperand = '';
      operation = null;
      shouldResetScreen = false;
      updateDisplay();
    }

    function handleAction(action) {
      switch (action) {
        case 'clear': clearCalculator(); break;
        case 'equals': calculate(); break;
        case 'decimal':
          if (currentOperand === 'Error' || shouldResetScreen) {
            currentOperand = '0.';
            shouldResetScreen = false;
          } else if (!currentOperand.includes('.')) {
            currentOperand += '.';
          }
          updateDisplay();
          break;
        case 'sign':
          if (currentOperand !== '0' && currentOperand !== 'Error') {
            currentOperand = currentOperand.startsWith('-')
              ? currentOperand.slice(1)
              : `-${currentOperand}`;
          }
          updateDisplay();
          break;
        case 'percent':
          if (currentOperand !== 'Error') {
            currentOperand = String(Number(currentOperand) / 100);
            shouldResetScreen = true;
          }
          updateDisplay();
          break;
      }
    }

    document.querySelector('.keys').addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;

      if (button.dataset.digit !== undefined) appendDigit(button.dataset.digit);
      else if (button.dataset.operation) chooseOperation(button.dataset.operation);
      else if (button.dataset.action) handleAction(button.dataset.action);
    });

    document.addEventListener('keydown', (event) => {
      if (/^[0-9]$/.test(event.key)) appendDigit(event.key);
      else if (event.key === '.') handleAction('decimal');
      else if (event.key === 'Enter' || event.key === '=') handleAction('equals');
      else if (event.key === 'Escape' || event.key === 'Delete') handleAction('clear');
      else if (event.key === '+') chooseOperation('+');
      else if (event.key === '-') chooseOperation('−');
      else if (event.key === '*') chooseOperation('×');
      else if (event.key === '/') chooseOperation('÷');
      else return;
      event.preventDefault();
    });
  </script>
</body>
</html>
